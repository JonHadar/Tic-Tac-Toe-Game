# Weekly dependency updates.
# Minor and patch updates are grouped into one pull request per ecosystem;
# major updates get their own pull requests so breaking changes stand out.
version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 breaks `npm run dev` (ts-node); revisit with tsx.
      - dependency-name: typescript
        versions: ['>=7']
      # Upgraded together with the Node.js runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      client-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # MUI 9 changes component APIs (e.g. Stack); needs a planned migration.
      - dependency-name: '@mui/*'
        versions: ['>=9']
      - dependency-name: typescript
        versions: ['>=7']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directories: [/server, /client]
    schedule:
      interval: weekly
    ignore:
      # Node.js majors are upgraded in one PR together with CI and @types/node.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
