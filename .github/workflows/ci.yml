name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dev server starts (npm run dev)
        run: |
          PORT=5055 npm run dev > dev.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:5055/api/health; then exit 0; fi
            sleep 1
          done
          cat dev.log
          exit 1

  client:
    name: Client (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dev server starts (npm run dev)
        run: |
          npm run dev -- --port 3055 --strictPort > dev.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3055/ | grep -q 'id="root"'; then exit 0; fi
            sleep 1
          done
          cat dev.log
          exit 1

  docker:
    name: Docker (build and smoke test)
    needs: [server, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      - name: Start the stack and wait until healthy
        run: docker compose up -d --wait
      - name: Smoke test through nginx
        run: |
          curl --fail --silent http://localhost:3000/ | grep -q '<title>Tic-Tac-Toe</title>'
          curl --fail --silent http://localhost:3000/api/health
          curl --fail --silent -X POST -H 'Content-Type: application/json' \
            -d '{"winner":"X"}' http://localhost:3000/api/win
          curl --fail --silent http://localhost:3000/api/stats | grep -q '"X":1'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down

  helm:
    name: Helm chart (lint, validate)
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/tic-tac-toe
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Lint and validate dev and prod manifests
        run: |
          for env in dev prod; do
            helm lint "$CHART" -f "$CHART/values-$env.yaml"
            helm template tic-tac-toe "$CHART" -f "$CHART/values-$env.yaml" --set ingress.enabled=true \
              | kubeconform -strict -summary -kubernetes-version 1.33.0
          done

  kubernetes:
    name: Kubernetes (deploy to kind and test)
    needs: [server, client, helm]
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/tic-tac-toe
      NAMESPACE: tic-tac-toe
      TAG: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Create a temporary cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: ci
      - name: Build images and load them into the cluster
        run: |
          for service in server client; do
            image="ghcr.io/jonhadar/tic-tac-toe-$service:$TAG"
            docker build -t "$image" "./$service"
            kind load docker-image --name ci "$image"
          done
      - name: Install the chart with dev values
        run: |
          helm install tic-tac-toe "$CHART" \
            --namespace "$NAMESPACE" --create-namespace \
            -f "$CHART/values-dev.yaml" \
            --set image.tag="$TAG" \
            --set image.pullPolicy=Never \
            --wait --timeout 3m
          kubectl -n "$NAMESPACE" get pods
      - name: Run helm test
        run: helm test tic-tac-toe --namespace "$NAMESPACE" --logs
      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get all
          kubectl -n "$NAMESPACE" describe pods
          kubectl -n "$NAMESPACE" logs --all-containers --prefix -l app.kubernetes.io/name=tic-tac-toe --tail=100 || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp

  scan:
    name: Scan ${{ matrix.service }} image
    needs: [server, client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [server, client]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t tic-tac-toe-${{ matrix.service }}:scan ./${{ matrix.service }}
      # Code scanning is free only for public repositories.
      - name: Report vulnerabilities to the Security tab
        if: ${{ !github.event.repository.private }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tic-tac-toe-${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !github.event.repository.private }}
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
      - name: Fail on critical vulnerabilities that have a fix
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tic-tac-toe-${{ matrix.service }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: Publish ${{ matrix.service }} image
    # Images are published only if every check passes.
    needs: [docker, scan, kubernetes]
    # Only real pushes to main or version tags publish; pull requests just test.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [server, client]
    steps:
      - uses: actions/checkout@v7
      - name: Image name (registry paths must be lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tic-tac-toe-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # main -> latest + sha-<commit>; tag v1.2.3 -> 1.2.3 and 1.2
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  promote-dev:
    name: Deploy to dev (GitOps)
    needs: publish
    # Only for new commits on main; version tags are released to prod by hand.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Point dev at the image just published
        env:
          TAG: sha-${{ github.sha }}
        run: |
          # docker/metadata-action uses the 7-character short SHA.
          TAG="${TAG:0:11}"
          file=deploy/helm/tic-tac-toe/values-dev.yaml
          yq -i '.image.tag = strenv(TAG)' "$file"
          if git diff --quiet; then
            echo "dev already runs $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy $TAG to dev"
          # Pushes made with GITHUB_TOKEN do not start new workflow runs, so this
          # commit cannot trigger a loop. Retry if main moved in the meantime.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
