apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tic-tac-toe.clientName" . }}
  labels:
    {{- include "tic-tac-toe.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  replicas: {{ .Values.client.replicaCount }}
  selector:
    matchLabels:
      {{- include "tic-tac-toe.selectorLabels" (dict "ctx" . "component" "client") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tic-tac-toe.labels" . | nindent 8 }}
        app.kubernetes.io/component: client
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: client
          image: "{{ .Values.client.image.repository }}:{{ include "tic-tac-toe.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # nginx forwards /api/* here (see client/templates/default.conf.template).
            - name: API_UPSTREAM
              value: "http://{{ include "tic-tac-toe.serverName" . }}:{{ .Values.server.port }}"
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.client.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tic-tac-toe.clientName" . }}
  labels:
    {{- include "tic-tac-toe.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  type: {{ .Values.client.service.type }}
  selector:
    {{- include "tic-tac-toe.selectorLabels" (dict "ctx" . "component" "client") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.client.service.port }}
      targetPort: http
